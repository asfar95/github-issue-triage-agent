<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <rect width="900" height="620" fill="#0d1117"/>

  <!-- Top bar -->
  <rect width="900" height="48" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="30" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edf3">Possible SQL injection vulnerability in login endpoint</text>
  <text x="592" y="30" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" fill="#8b949e">#11</text>
  <rect x="20" y="54" width="64" height="24" rx="12" fill="#238636"/>
  <text x="52" y="70" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#ffffff">⊙ Open</text>

  <!-- Avatar (issue) -->
  <circle cx="46" cy="120" r="18" fill="#1f6feb" opacity="0.6"/>
  <text x="46" y="125" text-anchor="middle" font-size="14" fill="#e6edf3">A</text>

  <!-- Issue body box -->
  <rect x="70" y="96" width="700" height="230" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="96" width="700" height="36" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="118" width="700" height="14" fill="#1c2128"/>
  <text x="88" y="119" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">asfar95</text>
  <text x="148" y="119" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">opened 9 minutes ago</text>
  <rect x="722" y="104" width="36" height="18" rx="9" fill="#30363d"/>
  <text x="740" y="116" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Owner</text>

  <text x="88" y="152" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Security Report</text>
  <line x1="88" y1="160" x2="754" y2="160" stroke="#30363d" stroke-width="1"/>
  <text x="88" y="180" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">I noticed that the login endpoint appears to concatenate user input directly into a query string without sanitisation.</text>

  <!-- Code block -->
  <rect x="88" y="192" width="400" height="64" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="104" y="212" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#e6edf3">POST /login</text>
  <text x="104" y="230" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#e6edf3">username=admin' OR '1'='1</text>
  <text x="104" y="248" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#e6edf3">password=anything</text>

  <text x="88" y="278" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">This allowed me to bypass authentication on my local copy. I haven't tested it on production.</text>
  <text x="88" y="298" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">Please treat this as a potential security issue. I'm happy to share more details privately if needed.</text>

  <!-- Bot comment -->
  <circle cx="46" cy="398" r="18" fill="#1f6feb" opacity="0.6"/>
  <text x="46" y="403" text-anchor="middle" font-size="14" fill="#e6edf3">A</text>

  <rect x="70" y="374" width="700" height="188" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="374" width="700" height="36" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="396" width="700" height="14" fill="#1c2128"/>
  <text x="88" y="397" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">asfar95</text>
  <text x="148" y="397" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">9 minutes ago</text>
  <rect x="686" y="382" width="36" height="18" rx="9" fill="#30363d"/>
  <text x="704" y="394" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Owner</text>
  <rect x="726" y="382" width="38" height="18" rx="9" fill="#30363d"/>
  <text x="745" y="394" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Author</text>

  <text x="88" y="428" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">👋 I've reviewed this issue but flagged it for human review because:</text>

  <!-- Blockquote -->
  <rect x="88" y="438" width="4" height="28" rx="2" fill="#3d444d"/>
  <text x="100" y="450" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e" font-style="italic">Potential SQL injection vulnerability in login endpoint requires human assessment for impact and disclosure</text>

  <text x="88" y="482" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Questions for the reviewer:</text>
  <text x="88" y="502" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">• Is this a confirmed vulnerability and what is its severity?</text>
  <text x="88" y="520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">• What are the necessary steps to patch this issue?</text>

  <text x="88" y="546" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">I've applied the <tspan font-family="'SFMono-Regular',Consolas,monospace" fill="#e4b429">needs-human-review</tspan> label so a maintainer can take a look. I haven't closed or changed anything else.</text>

  <!-- Label activity -->
  <text x="88" y="586" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">asfar95 added</text>
  <rect x="174" y="572" width="126" height="18" rx="9" fill="#e4b429" opacity="0.2" stroke="#e4b429" stroke-width="1"/>
  <text x="237" y="584" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#e4b429">needs-human-review</text>
  <text x="304" y="586" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">9 minutes ago</text>

  <!-- Right sidebar -->
  <text x="800" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Labels</text>
  <rect x="800" y="128" width="84" height="18" rx="9" fill="#e4b429" opacity="0.2" stroke="#e4b429" stroke-width="1"/>
  <text x="842" y="140" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#e4b429">needs-human-review</text>
</svg>
