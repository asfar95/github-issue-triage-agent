<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
  <rect width="900" height="580" fill="#0d1117"/>

  <!-- Top bar -->
  <rect width="900" height="48" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="30" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edf3">Login API is broken — always returns 401</text>
  <text x="480" y="30" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" fill="#8b949e">#9</text>

  <!-- Closed badge -->
  <rect x="20" y="54" width="76" height="24" rx="12" fill="#8957e5" opacity="0.3" stroke="#8957e5" stroke-width="1"/>
  <text x="58" y="70" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#bc8cff">✕ Closed</text>
  <!-- Invalid label -->
  <rect x="104" y="54" width="52" height="24" rx="12" fill="#6e7681" opacity="0.3" stroke="#6e7681" stroke-width="1"/>
  <text x="130" y="70" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#8b949e">invalid</text>

  <!-- Issue body box -->
  <circle cx="46" cy="118" r="18" fill="#1f6feb" opacity="0.6"/>
  <text x="46" y="123" text-anchor="middle" font-size="14" fill="#e6edf3">A</text>

  <rect x="70" y="94" width="700" height="190" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="94" width="700" height="36" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="116" width="700" height="14" fill="#1c2128"/>
  <text x="88" y="117" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">asfar95</text>
  <text x="148" y="117" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">opened 23 minutes ago</text>

  <text x="88" y="152" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Bug Report</text>
  <line x1="88" y1="160" x2="754" y2="160" stroke="#30363d" stroke-width="1"/>
  <text x="88" y="178" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">The login endpoint is completely broken. It always returns 401 Unauthorized no matter what I send.</text>
  <text x="88" y="200" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">What I'm doing:</text>

  <!-- Code block -->
  <rect x="88" y="210" width="420" height="42" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="104" y="228" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#e6edf3">curl -X POST http://localhost:3000/api/login \</text>
  <text x="104" y="246" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#e6edf3">  -d '{"username":"admin","password":"admin123"}'</text>

  <text x="88" y="270" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">This clearly a bug in the authentication logic. The API should accept my credentials.</text>

  <!-- Bot comment -->
  <circle cx="46" cy="366" r="18" fill="#1f6feb" opacity="0.6"/>
  <text x="46" y="371" text-anchor="middle" font-size="14" fill="#e6edf3">A</text>

  <rect x="70" y="342" width="700" height="178" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="342" width="700" height="36" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="364" width="700" height="14" fill="#1c2128"/>
  <text x="88" y="365" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">asfar95</text>
  <text x="148" y="365" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">13 minutes ago</text>

  <text x="88" y="398" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">The login API is not working as expected because the password <tspan font-family="'SFMono-Regular',Consolas,monospace" fill="#79c0ff">'admin123'</tspan> you are using does not</text>
  <text x="88" y="418" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">match the hardcoded password (<tspan font-family="'SFMono-Regular',Consolas,monospace" fill="#79c0ff">'password123'</tspan>) in the code. You should use the correct password</text>
  <text x="88" y="438" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">to successfully login.</text>

  <text x="88" y="466" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">I reviewed <tspan font-family="'SFMono-Regular',Consolas,monospace" fill="#79c0ff">src/auth.js</tspan> and confirmed this is not a bug — the API is working as designed.</text>
  <text x="88" y="486" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Closing this as <tspan font-weight="600">not planned</tspan>. Feel free to reopen if the issue persists after using the correct credentials.</text>

  <!-- Closure activity -->
  <text x="88" y="540" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">asfar95 closed this as</text>
  <text x="218" y="540" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#8b949e">not planned</text>
  <text x="296" y="540" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">13 minutes ago</text>

  <!-- Right sidebar -->
  <text x="800" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Labels</text>
  <rect x="800" y="128" width="52" height="18" rx="9" fill="#6e7681" opacity="0.3" stroke="#6e7681" stroke-width="1"/>
  <text x="826" y="140" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#8b949e">invalid</text>
</svg>
