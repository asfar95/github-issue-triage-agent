<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
  <rect width="900" height="580" fill="#0d1117"/>

  <!-- Top bar -->
  <rect width="900" height="48" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="30" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edf3">Login button does not work on mobile</text>
  <text x="486" y="30" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" fill="#8b949e">#10</text>
  <rect x="20" y="54" width="64" height="24" rx="12" fill="#238636"/>
  <text x="52" y="70" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#ffffff">⊙ Open</text>

  <!-- Main content area -->
  <!-- Avatar -->
  <circle cx="46" cy="120" r="18" fill="#1f6feb" opacity="0.6"/>
  <text x="46" y="125" text-anchor="middle" font-size="14" fill="#e6edf3">A</text>

  <!-- Issue body box -->
  <rect x="70" y="96" width="700" height="260" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="96" width="700" height="36" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="118" width="700" height="14" fill="#1c2128"/>
  <text x="88" y="119" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" font-weight="600">asfar95</text>
  <text x="148" y="119" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">opened 12 minutes ago</text>
  <rect x="722" y="104" width="36" height="18" rx="9" fill="#30363d" stroke="#30363d" stroke-width="1"/>
  <text x="740" y="116" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Owner</text>

  <text x="88" y="152" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Bug Report</text>
  <line x1="88" y1="160" x2="754" y2="160" stroke="#30363d" stroke-width="1"/>
  <text x="88" y="180" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Description:</text>
  <text x="88" y="198" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">The login button on the homepage doesn't respond to taps on mobile browsers.</text>
  <text x="88" y="224" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Steps to reproduce:</text>
  <text x="88" y="244" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">  1. Open the site on an iPhone (Safari or Chrome)</text>
  <text x="88" y="262" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">  2. Tap the login button</text>
  <text x="88" y="280" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">  3. Nothing happens — no navigation, no error</text>
  <text x="88" y="306" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3"><tspan font-weight="700">Expected:</tspan> Should navigate to /login</text>
  <text x="88" y="326" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3"><tspan font-weight="700">Actual:</tspan> Button does nothing</text>

  <!-- Bot comment -->
  <circle cx="46" cy="408" r="18" fill="#1f6feb" opacity="0.6"/>
  <text x="46" y="413" text-anchor="middle" font-size="14" fill="#e6edf3">A</text>

  <rect x="70" y="384" width="700" height="130" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="384" width="700" height="36" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <rect x="70" y="406" width="700" height="14" fill="#1c2128"/>
  <text x="88" y="407" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" font-weight="600">asfar95</text>
  <text x="148" y="407" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">12 minutes ago</text>
  <rect x="686" y="392" width="36" height="18" rx="9" fill="#30363d"/>
  <text x="704" y="404" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Owner</text>
  <rect x="726" y="392" width="38" height="18" rx="9" fill="#30363d"/>
  <text x="745" y="404" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Author</text>

  <text x="88" y="436" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">The issue seems to be related to the login button not responding to taps on mobile browsers. I've reviewed the</text>
  <text x="88" y="454" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">code in <tspan font-family="'SFMono-Regular',Consolas,monospace" fill="#79c0ff">src/index.js</tspan> and found that the login endpoint is defined as a POST request. However, the issue</text>
  <text x="88" y="472" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">might be related to the frontend code, which is not provided here. Could you please provide more information</text>
  <text x="88" y="490" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">about the frontend code and how the login button is handled?</text>

  <!-- Label activity -->
  <text x="88" y="536" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">asfar95 added</text>
  <rect x="174" y="522" width="34" height="18" rx="9" fill="#da3633" opacity="0.8"/>
  <text x="191" y="534" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#fff">bug</text>
  <text x="212" y="536" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">12 minutes ago</text>

  <!-- Right sidebar -->
  <text x="800" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Labels</text>
  <rect x="800" y="128" width="34" height="18" rx="9" fill="#da3633" opacity="0.8"/>
  <text x="817" y="140" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#fff">bug</text>
</svg>
