<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560">
  <defs>
    <style>
      .bg     { fill: #1e1e2e; }
      .title  { fill: #cdd6f4; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; }
      .dim    { fill: #6c7086; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; }
      .green  { fill: #a6e3a1; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; }
      .yellow { fill: #f9e2af; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; }
      .blue   { fill: #89b4fa; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; }
      .red    { fill: #f38ba8; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; }
      .mauve  { fill: #cba6f7; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; }
      .teal   { fill: #94e2d5; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; }
    </style>
  </defs>

  <!-- Window chrome -->
  <rect width="780" height="560" rx="10" ry="10" class="bg"/>
  <rect width="780" height="36" rx="10" ry="10" fill="#313244"/>
  <rect y="26" width="780" height="10" fill="#313244"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>

  <!-- Window title -->
  <text x="390" y="23" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" fill="#6c7086">github-issue-triage-agent — node src/cli.js</text>

  <!-- Line 1: command -->
  <text x="20" y="68" class="dim">$</text>
  <text x="32" y="68" class="title">node src/cli.js asfar95/sample-app 12</text>

  <!-- Line 2: agent start -->
  <text x="20" y="90" class="mauve">🤖 Agent starting triage for asfar95/sample-app#12</text>

  <!-- Iteration 1 -->
  <text x="20" y="116" class="yellow">🔄 Iteration 1</text>
  <text x="20" y="136" class="blue">  🔧 Calling tool: get_issue_details</text>
  <text x="20" y="152" class="dim">       {"issue_number":12,"owner":"asfar95","repo":"sample-app"}</text>
  <text x="20" y="168" class="green">     ✅ get_issue_details succeeded</text>
  <text x="20" y="184" class="blue">  🔧 Calling tool: get_repo_labels</text>
  <text x="20" y="200" class="dim">       {"owner":"asfar95","repo":"sample-app"}</text>
  <text x="20" y="216" class="green">     ✅ get_repo_labels succeeded</text>

  <!-- Iteration 2 -->
  <text x="20" y="242" class="yellow">🔄 Iteration 2</text>
  <text x="20" y="262" class="blue">  🔧 Calling tool: search_similar_issues</text>
  <text x="20" y="278" class="dim">       {"query":"login button mobile","owner":"asfar95","repo":"sample-app"}</text>
  <text x="20" y="294" class="green">     ✅ search_similar_issues succeeded</text>
  <text x="20" y="310" class="blue">  🔧 Calling tool: list_repo_files</text>
  <text x="20" y="326" class="dim">       {"owner":"asfar95","path":"","repo":"sample-app"}</text>
  <text x="20" y="342" class="green">     ✅ list_repo_files succeeded</text>

  <!-- Iteration 3 -->
  <text x="20" y="368" class="yellow">🔄 Iteration 3</text>
  <text x="20" y="388" class="blue">  🔧 Calling tool: get_file_content</text>
  <text x="20" y="404" class="dim">       {"owner":"asfar95","path":"src/index.js","repo":"sample-app"}</text>
  <text x="20" y="420" class="green">     ✅ get_file_content succeeded</text>

  <!-- Iteration 4 -->
  <text x="20" y="446" class="yellow">🔄 Iteration 4</text>
  <text x="20" y="466" class="blue">  🔧 Calling tool: add_labels</text>
  <text x="20" y="482" class="dim">       {"labels":["bug"],"issue_number":12,"owner":"asfar95","repo":"sample-app"}</text>
  <text x="20" y="498" class="green">     ✅ add_labels succeeded</text>
  <text x="20" y="514" class="blue">  🔧 Calling tool: post_comment</text>
  <text x="20" y="530" class="green">     ✅ post_comment succeeded</text>

  <!-- Done -->
  <text x="20" y="554" class="teal">✅ Agent finished after 5 iteration(s)</text>
</svg>
